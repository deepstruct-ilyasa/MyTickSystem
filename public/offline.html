<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sedang Offline - MyTickSystem</title>
    <link href="/css/output.css" rel="stylesheet">
</head>
<body class="bg-gray-50 font-sans antialiased flex items-center justify-center h-screen m-0">

    <div class="max-w-md w-full mx-auto text-center p-6 bg-white rounded-2xl shadow-sm border border-gray-100">
        <div class="w-16 h-16 bg-amber-50 text-amber-600 rounded-full flex items-center justify-center mx-auto mb-4 text-2xl">
            📡
        </div>
        <h1 class="text-xl font-bold text-gray-800 mb-2">Anda Sedang Offline</h1>
        <p class="text-sm text-gray-500 mb-6">
            Koneksi internet terputus. Pastikan perangkat Anda terhubung ke jaringan untuk mengakses sistem ticketing.
        </p>
        
        <div class="space-y-3">
            <button onclick="window.location.reload()" class="w-full py-3 bg-blue-600 hover:bg-blue-700 text-white font-semibold rounded-xl text-sm transition shadow-sm">
                Coba Muat Ulang
            </button>
            <p id="status-text" class="text-xs text-gray-400 animate-pulse">Memeriksa sambungan internet...</p>
        </div>
    </div>

    <!-- ⭐ SKRIP ACTIVE PING & AUTO-REFRESH ⭐ -->
    <script>
        const statusText = document.getElementById('status-text');

        function checkConnection() {
            // Lakukan fetch ringan ke endpoint server atau root URL untuk mengetes koneksi
            fetch('/login', { method: 'HEAD', cache: 'no-store' })
                .then(response => {
                    if (response.ok || response.status < 500) {
                        if (statusText) {
                            statusText.innerText = "Koneksi pulih! Memuat ulang halaman...";
                            statusText.className = "text-xs text-green-600 font-semibold";
                        }
                        setTimeout(() => {
                            window.location.reload();
                        }, 800);
                    }
                })
                .catch(() => {
                    // Masih offline, abaikan dan biarkan looping berjalan
                });
        }

        // 1. Deteksi lewat event standar browser
        window.addEventListener('online', () => {
            checkConnection();
        });

        // 2. Deteksi aktif (polling) setiap 2 detik sekali untuk memastikan tanggap
        setInterval(() => {
            if (navigator.onLine) {
                checkConnection();
            }
        }, 2000);
    </script>
</body>
</html>
